server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: asset-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/asset_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  mvc:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发阶段打印 SQL，生产环境请关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.asset.management.entity

# JWT 配置
jwt:
  # 生产环境务必更换为随机生成的密钥（长度 >= 64 字节）
  secret: QXNzZXRNYW5hZ2VtZW50U3lzdGVtU2VjcmV0S2V5MjAyNENoYW5nZU1lQmVmb3JlUHJvZHVjdGlvbg==
  # 过期时间（毫秒），默认 24 小时
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

# 文件存储配置：local（本地磁盘，默认）| oss（S3 兼容对象存储）
# 切换存储后端只需修改 storage.type，业务代码与前端无需改动
storage:
  type: local
  # 存储渠道标识，会写入 sys_file；留空时按类型自动推导（local-default / oss-main）
  # 同类型可配置多套后端（如两个不同的 OSS 桶），迁移时按渠道区分
  channel: ""
  # 本地磁盘模式
  local:
    # 文件落盘根目录，支持相对路径与绝对路径
    base-path: ./data/upload
    # 文件访问前缀
    url-prefix: /api/file/preview
  # 对象存储模式（storage.type=oss 时生效），兼容 MinIO / 腾讯云 COS / AWS S3 等
  oss:
    endpoint: http://127.0.0.1:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: asset-management
    region: us-east-1
    # MinIO 必须为 true；AWS S3、腾讯云 COS 使用 false
    path-style: true
    # 对象键统一前缀，便于多个环境共用一个存储桶
    key-prefix: ""
    # 已绑定公网域名或 CDN 时填写，直接返回稳定直链；留空则返回带签名的临时地址
    public-domain: ""
    # 预签名地址有效期（秒）
    presigned-expiry: 3600

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.asset.management: info
    org.springframework.security: warn
